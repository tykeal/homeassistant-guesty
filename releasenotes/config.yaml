# SPDX-License-Identifier: Apache-2.0

default_branch: main
collapse_pre_releases: true
stop_at_branch_base: false
sections:
  - [upgrade, Upgrade Notes]
  - [features, New Features]
  - [fixes, Bug Fixes]
  - [deprecations, Deprecation Notes]
  - [security, Security Issues]
semver_major: []
semver_minor: []
semver_patch: []
template: |
  ---
  # Write release note entries in Markdown and remove unused sections.
  # Breaking changes must include operator guidance under upgrade.
  # prelude: |
  #   Optional summary rendered before the sections.
  upgrade:
    - |
      Describe the required operator action and its impact.
  features:
    - |
      Describe a user-visible capability.
  fixes:
    - |
      Describe a user-visible bug fix.
  deprecations:
    - |
      Describe what is deprecated and what to use instead.
  security:
    - |
      Describe the security issue that was fixed.
