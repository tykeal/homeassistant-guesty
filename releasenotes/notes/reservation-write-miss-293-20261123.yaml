fixes:
  - |
    An eligible reservation write targeting a missing identity may
    trigger one refresh using the configured reservation source.
    The write remains fail-closed if the refresh fails or identity
    and routing evidence is insufficient. Guesty may not yet have
    indexed a newly created booking.
