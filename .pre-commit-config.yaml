ci:
  autofix_commit_msg: |
    Chore: pre-commit.ci automated linting tools update

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci[bot]@pre-commit.ci>

    Changes in this pull request are as follows:
  autoupdate_commit_msg: |
    Chore: pre-commit.ci automated linting tools update

    Signed-off-by: pre-commit-ci[bot] <pre-commit-ci[bot]@pre-commit.ci>

    Changes in this pull request are as follows:
  skip: [mypy]

exclude: |
  (?x)(
      ^docs\/conf.py|
      ^dco-signoffs/|
      ^tests/resources
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
        exclude: (^|/)\.git($|/)
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      # - id: double-quote-string-fixer
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: name-tests-test
        args: ["--pytest-test-first"]
      # Disabled; TOX lint will otherwise fail
      - id: no-commit-to-branch
        args:
          - --branch=main
      # - id: pretty-format-json
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ^.(specify|github)/

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint
        # args: ["-c body-max-line-length=120", "-c title-max-length=120"]

  - repo: https://github.com/openstack/bashate
    rev: 5798d24d571676fc407e81df574c1ef57b520f23  # frozen: 2.1.1
    hooks:
      - id: bashate
        args: ["--ignore=E006,E011"]
        exclude: ^.(specify|github)/

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a6564f5d57444e123433a5c9af733e3975c77229  # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: ["-x"] # Check external files
        exclude: |
          (?x)
          ^.specify/scripts/

  # Actively maintained fork of https://github.com/rhysd/actionlint
  # Upstream is stalled at v1.7.12, which predates GitHub's
  # 'concurrency.queue' key and rejects it as an unexpected key.
  # semantic-pull-request.yaml relies on that key to queue superseded
  # runs instead of cancelling them. This fork understands it.
  - repo: https://github.com/kjanat/actionlint
    rev: 2da2ceb4af2c7ecc48f5b9311d85080c3971b5f0  # frozen: v1.17.0
    hooks:
      - id: actionlint

  # Static security analysis of workflow definitions. Mirrors the
  # 'Zizmor' CI job so findings surface before the push rather than
  # after it. Runs offline, which is zizmor's default without a token:
  # the audits that resolve 'uses:' refs over the API (such as
  # ref-version-mismatch) only run in CI.
  #
  # pre-commit.ci keeps this 'rev' on the newest release while the CI
  # job pins its analyzer explicitly, so this hook may sit a version
  # ahead. That direction is the safe one -- a newly added audit stops
  # a commit here instead of a merge there -- but when the two drift,
  # reconcile by raising the CI pin rather than holding this one back.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        # Must match the 'persona:' input on the 'Zizmor' workflow job,
        # which is a required check. zizmor takes the persona only from
        # the command line, never from '.github/zizmor.yml', so without
        # this the hook would audit a weaker rule set than the gate and
        # a permission added here would pass locally and fail on push.
        args: ['--persona=auditor']

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        types: [yaml]
        args:
          [
            "-d",
            "{rules: {line-length: {max: 100}}, ignore-from-file: [.gitignore],}",
          ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/fsfe/reuse-tool
    rev: bffd9abdccdd86e7926c871a31564913547552c9  # frozen: v6.3.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      - id: mypy-cache
        name: "create mypy cache"
        language: system
        pass_filenames: false
        entry: bash -c 'if [ ! -d .mypy_cache ]; then mkdir .mypy_cache; fi; exit 0'

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
    hooks:
      - id: validate-pyproject
        # Optional extra validations from SchemaStore:
        additional_dependencies: ["validate-pyproject-schema-store[all]"]

  # - repo: https://github.com/btford/write-good
  #   rev: f4bd563644dd2c201cedd86c2670305686c16450  # frozen: v1.0.8
  #   hooks:
  #     - id: write-good
  #       files: "\\.(rst|md|markdown|mdown|mkdn)$"
  #       exclude:
  #         - .github/agents/*

  # Check for misspellings in documentation files
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
      - id: codespell
        args: ["-L", "hass,checkin,notin"]

  # Automatically upgrade Python syntax for newer versions
  # - repo: https://github.com/asottile/pyupgrade
  #   rev: v3.15.0
  #   hooks:
  #     - id: pyupgrade
  #       args: ['--py37-plus']

  - repo: https://github.com/econchick/interrogate
    rev: a6268877efd41a21197445cc04cbf28f9c6facba  # frozen: 1.7.0
    hooks:
      - id: interrogate
        args: [-vv, --fail-under=100]
        additional_dependencies:
          - setuptools

  # mypy runs through the project environment rather than
  # mirrors-mypy. The mirror builds an isolated virtualenv from
  # additional_dependencies, which resolves a different Home Assistant
  # than uv.lock pins and therefore type checks against the wrong
  # stubs. Running 'uv run mypy' guarantees the same interpreter and
  # dependency set as the test suite. pre-commit.ci has no uv, so the
  # hook stays in the ci skip list above; the Type Check workflow in
  # .github/workflows/type-check.yaml is what enforces mypy in CI.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: system
        pass_filenames: false
        require_serial: true
        types_or: [python, pyi]
        entry: uv run mypy --show-error-codes custom_components/ tests/

  # - repo: local
  #   hooks:
  #     - id: pytest-cov
  #       name: pytest (100% coverage)
  #       language: system
  #       entry: uv run pytest --no-header -q
  #       pass_filenames: false
