# Grype ignore rules for the "Generate SBOM" job.
#
# Every rule previously listed here was verified stale: scanning the
# CycloneDX SBOM produced by lfreleng-actions/python-sbom-action with
# ignores disabled reports no vulnerabilities at any severity. The
# homeassistant 2026.10.1 bump and the anyio/urllib3/idna/multidict
# upgrades moved every affected package past its fixed version, so the
# rules no longer matched anything and would only have masked the same
# advisories if they ever reappeared.
#
# Add a rule back only for a finding that is live and genuinely
# unfixable. Each entry must carry a `package:` scope and a comment
# naming the package and explaining why we cannot upgrade.
ignore: []
