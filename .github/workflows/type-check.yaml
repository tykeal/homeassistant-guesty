---
# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>
# SPDX-License-Identifier: Apache-2.0

# Static type checking with mypy.
#
# The mypy pre-commit hook is in the 'ci: skip' list because it shells out
# to 'uv run' and pre-commit.ci has no uv in its sandbox. That leaves no
# other place where typing is enforced, so this workflow is the gate.
#
# Running mypy through 'uv run' is the whole point: it resolves the
# environment from uv.lock, so CI type checks against the exact Home
# Assistant and Python versions the project pins. An isolated environment
# built from a separate dependency list silently checks the wrong stubs
# and reports success on code that does not type check.
name: 'Type Check'

# yamllint disable-line rule:truthy
on:
  # 'edited' is deliberately absent. It fires on PR title/body
  # changes, which cannot affect type checking, and
  # 'cancel-in-progress' then kills the live run for the same SHA,
  # leaving a phantom cancelled check behind.
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
  workflow_dispatch:

# No 'paths' filter by design. A skipped workflow reports no status at
# all, so a path filter would leave this check permanently pending on
# any PR that touches only excluded paths, which blocks the merge for
# good once the check is required.

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  # The job name becomes the status check context. Keep it stable:
  # renaming it would orphan the entry in any branch ruleset that
  # requires it.
  mypy:
    name: 'Type Check'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    # Python 3.14 has no prebuilt wheels for parts of the Home Assistant
    # dependency tree, so a cache miss (any uv.lock change) makes
    # 'uv sync' build those from source. That is slow in the same way
    # the SBOM job is slow, and a tight limit would fail the gate for
    # reasons unrelated to typing.
    timeout-minutes: 45
    steps:
      # Loads the block-mode egress allow-list before harden-runner's
      # own pre hook runs, and publishes it as CONNECTION_ALLOW_LIST.
      # See '.github/harden-runner/allow_list.txt' for the mechanism.
      #
      # 'config' names the shared Linux Foundation RelEng list by an
      # explicit in-repo path, pinned to a commit. The pin is the point:
      # an unpinned cross-org fetch would let a third party widen this
      # job's egress policy with no review here. An explicit path also
      # fails loudly if the file ever moves, rather than falling through
      # a search chain to some other file.
      #
      # 'supplemental_config' layers this repository's own list on top.
      # It is a search chain ('//' with nothing after it), not an
      # explicit path, so a miss is tolerated instead of fatal, and it
      # is unpinned, which the action permits only within the
      # workflow's own org. Both lists are fetched over the network
      # from a default branch or a pinned commit, never from the
      # checked-out tree, so a pull request -- including one from a
      # fork -- cannot widen its own allow-list by editing either file.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        id: 'egress'
        with:
          # yamllint disable-line rule:line-length
          config: 'lfreleng-actions/.github//.github/harden-runner/lfreleng-actions/allow_list.txt@e6f7647d8aba77836b1e1ccbadc945934607ed98'
          supplemental_config: 'tykeal/homeassistant-guesty//'
          supplemental_unpinned: 'true'
          # Anonymous fetches of a public config repository are rate
          # limited; the job token lifts that and grants nothing extra.
          token: '${{ github.token }}'

      # Pinned ahead of the other workflows, which still run v2.22.2 in
      # audit mode. v2.22.3 fixed allowed connections being blocked by
      # GitHub's DNS resolver and outbound proxy experiment on hosted
      # Linux runners, and v2.22.4 made that workaround default to
      # enabled when the StepSecurity feature-flag fetch fails, which
      # it does from these runners. On v2.22.2 that combination
      # dropped github.com by IP, with no domain mapping, and failed
      # checkout in roughly one run in three. Audit mode never noticed,
      # because it blocks nothing.
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          # Read from the loader rather than written out again, so
          # this job has a single policy value that cannot drift from
          # the one the assertion below checks. This is the form the
          # action documents for a harden-runner 'with:' block; the
          # equivalent step output is published in the pre phase and
          # is not addressable here. The loader only recommends
          # 'audit' under 'invalid_records: warning', which this
          # workflow does not use, so it is always 'block' -- and if
          # it ever is not, the assertion fails the job.
          egress-policy: '${{ env.HARDEN_RUNNER_EGRESS_POLICY }}'
          allowed-endpoints: '${{ env.CONNECTION_ALLOW_LIST }}'

      # harden-runner fails OPEN: when it cannot resolve an allow-list
      # hostname it reverts the firewall and DNS changes, leaving the
      # job with no egress filtering at all while still reporting
      # success. The block action guards that twice -- it drops
      # unresolvable entries before they reach harden-runner
      # ('invalid_records: filter', the default) and its main step
      # fails the job if the agent never reports enforcement in place
      # ('agent_not_ready: error', the default) -- but both guards live
      # inside the action. This step states the expectation in the
      # workflow instead, so that a future change which quietly
      # degrades enforcement turns this check red rather than green.
      #
      # Both halves matter. The policy variable is what the loader
      # asked for, and is the same value harden-runner was given
      # above, so the two cannot disagree. It does not say the agent
      # is actually running, so it is checked together with the
      # loader's 'agent_status' output, published by its main step
      # after harden-runner started. That must be 'ready': the agent
      # reported
      # enforcement in place. Every other value -- 'skipped' (no agent
      # to wait for), 'timeout', 'reverted', 'failed', 'disabled' --
      # means traffic is not being filtered, and 'skipped' in
      # particular does not fail the loader on its own.
      - name: 'Assert egress policy is enforcing'
        shell: 'bash'
        env:
          POLICY: '${{ env.HARDEN_RUNNER_EGRESS_POLICY }}'
          AGENT_STATUS: '${{ steps.egress.outputs.agent_status }}'
        run: |
          # Assert egress policy is enforcing
          set -euo pipefail
          echo "egress_policy=${POLICY} agent_status=${AGENT_STATUS}"
          rc=0
          if [ "${POLICY}" != "block" ]; then
            echo "::error::Egress policy is '${POLICY}', expected 'block'"
            rc=1
          fi
          if [ "${AGENT_STATUS}" != "ready" ]; then
            echo "::error::harden-runner agent status is" \
              "'${AGENT_STATUS}', expected 'ready'; egress is not" \
              "being filtered"
            rc=1
          fi
          exit "${rc}"

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Nothing in this job writes to git.
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: 'Install locked dependencies'
        shell: 'bash'
        run: |
          # Install locked dependencies
          set -euo pipefail
          # --locked refuses to proceed when uv.lock is stale, so a
          # drifted lock file fails here rather than silently type
          # checking against a resolution nobody committed.
          uv sync --locked

      - name: 'Run mypy'
        shell: 'bash'
        run: |
          # Run mypy
          set -euo pipefail
          # Matches the pre-commit hook entry exactly. Both directories
          # are passed explicitly so this stays a whole-tree check: a
          # typing change under custom_components/ must not be able to
          # break an untouched caller in tests/ without failing.
          uv run --no-sync mypy --show-error-codes custom_components/ tests/
