---
# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>
# SPDX-License-Identifier: Apache-2.0

# Runs on a new pull request, performs build and runs tests
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # 'edited' is deliberately absent. It fires on PR title/body
  # changes, which cannot affect the build, and 'cancel-in-progress'
  # then kills the live run for the same SHA, leaving a phantom
  # cancelled check behind. semantic-pull-request.yaml keeps 'edited'
  # because it validates the PR title.
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  repository-metadata:
    name: "Repository Metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # Metadata action reads PR files and commits
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Gather repository metadata"
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@cdfdc1d571dd45da13a8ef15439f330923040633  # v0.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: 'false'
          artifact_upload: 'true'
          artifact_formats: 'json'

  python-build:
    name: 'Python Build'
    runs-on: 'ubuntu-latest'
    outputs:
      matrix_json: "${{ steps.python-build.outputs.matrix_json }}"
      artefact_name: "${{ steps.python-build.outputs.artefact_name }}"
      artefact_path: "${{ steps.python-build.outputs.artefact_path }}"
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Build Python project'
        id: python-build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3a996fe53edf0117e283b9fef8d3aacaa9adaf02  # v2.1.2

  python-tests:
    name: 'Python Tests'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Python tests [pytest] ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@644a2008072617b9cf4846ca2b9d385691f9dc67  # v1.3.3
        with:
          python_version: ${{ matrix.python-version }}

  python-tests-gate:
    # Stable, non-matrix check context for branch protection.
    # 'python-tests' expands its matrix from requires-python, so it
    # reports as 'Python Tests (3.14)'. Requiring that string would
    # brick merges the moment requires-python is bumped, because the
    # context renames and the required check never reports again.
    # This job's name never changes, so it is safe to require.
    name: 'Python Tests Gate'
    runs-on: 'ubuntu-latest'
    needs: 'python-tests'
    # Without always() this job is skipped when the matrix fails, and
    # a skipped required check does not reliably block a merge.
    if: always()
    permissions: {}  # No repository access needed; reads needs context only
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Check matrix test result'
        env:
          # Aggregate result across every matrix leg: 'failure' if any
          # leg failed, 'cancelled'/'skipped' if the matrix never ran.
          TESTS_RESULT: "${{ needs.python-tests.result }}"
        run: |
          echo "python-tests result: ${TESTS_RESULT}"
          if [ "${TESTS_RESULT}" != "success" ]; then
            echo "::error::Python tests did not succeed (${TESTS_RESULT})"
            exit 1
          fi
          echo "All Python test matrix legs succeeded."

  python-audit:
    name: 'Python Audit'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Audit dependencies ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-audit-action@379a6a772cdf47b130bae3ab47718a22518bb83c  # v0.6.4
        with:
          python_version: "${{ matrix.python-version }}"
          # Transitive / upstream-pinned dep CVEs
          ignore_vulns: >-
            GHSA-4xh5-x5gv-qwph
            GHSA-cfh3-3jmp-rvhc
            GHSA-whj4-6x5x-4v2j
            GHSA-6w46-j5rx-g56g
            CVE-2026-32597
            CVE-2026-27448
            CVE-2026-27459
            CVE-2025-67221
            CVE-2026-3219

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'python-build'
    # A uv.lock change misses the dependency cache, so the SBOM step
    # builds sdists (numpy, grpcio, pydantic-core) from source and
    # needs far longer than a warm-cache run.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Generate SBOM"
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-sbom-action@639001a0def8109e045818dfb3ee82cf602657af  # v0.1.4
        with:
          # The action defaults to 3.12, which does not satisfy our
          # 'requires-python = ">=3.14.2"'. It hands the interpreter
          # to uv as UV_PYTHON with UV_PYTHON_DOWNLOADS=never, so uv
          # cannot resolve its own and 'uv lock --check' fails before
          # any SBOM is produced. The action takes a plain version
          # string with no way to read it from project metadata, so
          # this constant has to track requires-python by hand.
          # 'actions/setup-python' resolves it to the newest 3.14.x.
          python_version: "3.14"
          include_dev: "false"
          sbom_format: "both"

      - name: "Upload SBOM artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          retention-days: 45

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read  # Reads maintainer-approved Grype bypass issues
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # Supplies .github/grype-declared-dependencies.txt, which the
      # scan classifies its findings against.
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Download SBOM artefact"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files

      - name: "Grype audit SBOM"
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: 'medium'
          # Our own dependencies gate at 'medium' exactly as the
          # previous anchore/scan-action step did. Packages we merely
          # inherit - almost all of the SBOM, since Home Assistant
          # pins its requirements exactly and we cannot bump them from
          # here - are reported as warnings instead. They still reach
          # the job summary and the SARIF report; they just no longer
          # turn a pull request red with no fix available to us.
          dependency-policy: 'declared'
          transitive-fail-on: 'none'
          # The SBOM cannot answer the declared-vs-inherited question:
          # lfreleng-actions/python-sbom-action runs 'cyclonedx-py
          # environment', which scans the virtualenv rather than the
          # project and so emits no 'metadata.component' root. The
          # action refuses an unrooted graph, and an unusable source
          # leaves every finding classified as declared, which gates.
          # Supply the answer directly instead.
          declared-source: 'file'
          # yamllint disable-line rule:line-length
          declared-dependencies: '.github/grype-declared-dependencies.txt'
          cache-db: 'true'
          artifact-name: 'grype-scan-results'
          retention-days: 90
          summary-title: 'Grype Vulnerability Scan'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          permit-fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
